<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | Dreypella Ride</title>

    <link
        rel="stylesheet"
        href="login.css"
    >

</head>


<body>


    <main class="login-page">


        <section class="login-card">


            <!-- BACK -->

            <a
                href="index.html"
                class="back-link"
            >
                ← Back to Dreypella
            </a>


            <!-- LOGO -->

            <div class="logo">

                <span class="logo-main">
                    DREYPELLA
                </span>

                <span class="logo-sub">
                    RIDE
                </span>

            </div>


            <!-- TITLE -->

            <h1>
                Welcome Back
            </h1>

            <p class="subtitle">
                Login to your Dreypella account
            </p>


            <!-- LOGIN FORM -->

            <form id="loginForm">


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>


                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            id="togglePassword"
                            class="password-toggle"
                        >
                            Show
                        </button>

                    </div>

                </div>


                <!-- FORGOT PASSWORD -->

                <div class="form-options">

                    <a
                        href="forgot-password.html"
                        class="forgot-link"
                    >
                        Forgot password?
                    </a>

                </div>


                <!-- LOGIN BUTTON -->

                <button
                    type="submit"
                    id="loginButton"
                    class="login-button"
                >
                    LOGIN
                </button>


                <!-- MESSAGE -->

                <div
                    id="loginMessage"
                    class="message"
                ></div>


            </form>


            <!-- REGISTER -->

            <div class="register-section">

                <span>
                    Don't have an account?
                </span>

                <a href="register.html">
                    Create Account
                </a>

            </div>


        </section>


    </main>


    <!-- FIREBASE -->

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>


    <!-- YOUR FIREBASE CONFIG -->

    <script src="firebase-config.js"></script>


    <!-- LOGIN SCRIPT -->

    <script src="login.js"></script>


</body>

</html>
