<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Ride Reserved | Dreypella Ride
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>

        .reservation-page {
            min-height: 70vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .reservation-card {
            width: 100%;
            max-width: 620px;
            background: #ffffff;
            border-radius: 18px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 12px 40px rgba(0,0,0,0.08);
        }

        .reservation-icon {
            width: 72px;
            height: 72px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #fff4d6;
            color: #b8860b;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            font-weight: 700;
        }

        .reservation-card h1 {
            margin-bottom: 12px;
        }

        .reservation-card p {
            line-height: 1.7;
        }

        .reservation-status {
            margin: 25px 0;
            padding: 18px;
            border-radius: 12px;
            background: #f5f7fa;
            text-align: left;
        }

        .reservation-row {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            padding: 9px 0;
        }

        .reservation-row strong {
            text-align: right;
        }

        .reservation-actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 25px;
        }

        .reservation-button {
            display: block;
            width: 100%;
            padding: 14px 18px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 700;
            text-align: center;
        }

        .reservation-button.primary {
            background: #081b5a;
            color: #ffffff;
        }

        .reservation-button.secondary {
            border: 1px solid #d8dce5;
            color: #081b5a;
            background: #ffffff;
        }

        .loading-state,
        .error-state {
            padding: 30px 10px;
        }

        .error-state {
            color: #c62828;
        }

        @media (max-width: 600px) {

            .reservation-card {
                padding: 30px 20px;
            }

            .reservation-row {
                flex-direction: column;
                gap: 3px;
            }

            .reservation-row strong {
                text-align: left;
            }

        }

    </style>

</head>

<body>

    <section class="reservation-page">

        <div
            id="reservationContent"
            class="reservation-card"
        >

            <div class="loading-state">

                <h2>
                    Confirming your reservation...
                </h2>

                <p>
                    Please wait while we load your ride reservation.
                </p>

            </div>

        </div>

    </section>

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

    <script src="firebase-config.js"></script>

    <script src="auth-guard.js"></script>

    <script src="ride-reservation-success.js"></script>

</body>

</html>
