<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Notifications | Dreypella</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fb;
            color: #081b5a;
        }

        .container {
            width: 100%;
            max-width: 700px;
            margin: auto;
            padding: 20px;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .back {
            text-decoration: none;
            color: #081b5a;
            font-size: 22px;
        }

        .card {
            background: #fff;
            border-radius: 15px;
            padding: 18px;
            margin-bottom: 12px;
            box-shadow: 0 5px 20px rgba(8,27,90,.08);
        }

        .notification-title {
            font-weight: 700;
            margin-bottom: 6px;
        }

        .notification-text {
            color: #667085;
            line-height: 1.5;
        }

        .notification-date {
            margin-top: 8px;
            font-size: 12px;
            color: #98a2b3;
        }

        .empty {
            text-align: center;
            padding: 50px 20px;
            color: #667085;
        }

        .loading {
            text-align: center;
            padding: 40px;
        }
    </style>
</head>

<body>

<div class="container">

    <header class="header">
        <a href="customer-dashboard.html" class="back">←</a>
        <h1>Notifications</h1>
    </header>

    <div id="notificationsList">
        <div class="loading">
            Loading notifications...
        </div>
    </div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-functions-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="auth-guard.js"></script>

<script>
const notificationsList =
    document.getElementById("notificationsList");

dreypellaAuth.onAuthStateChanged(async function(user) {

    if (!user) {
        return;
    }

    try {

        const snapshot = await dreypellaDB
            .collection("notifications")
            .where("userId", "==", user.uid)
            .get();

        if (snapshot.empty) {
            notificationsList.innerHTML = `
                <div class="empty">
                    <h3>No notifications</h3>
                    <p>Your Dreypella updates will appear here.</p>
                </div>
            `;
            return;
        }

        const notifications = [];

        snapshot.forEach(function(doc) {
            notifications.push({
                id: doc.id,
                ...doc.data()
            });
        });

        notifications.sort(function(a, b) {

            const aTime =
                a.createdAt && a.createdAt.toDate
                    ? a.createdAt.toDate().getTime()
                    : 0;

            const bTime =
                b.createdAt && b.createdAt.toDate
                    ? b.createdAt.toDate().getTime()
                    : 0;

            return bTime - aTime;
        });

        notificationsList.innerHTML =
            notifications.map(function(notification) {

                const title =
                    notification.title ||
                    notification.type ||
                    "Dreypella";

                const text =
                    notification.message ||
                    notification.body ||
                    "You have a new notification.";

                let date = "";

                if (
                    notification.createdAt &&
                    notification.createdAt.toDate
                ) {
                    date =
                        notification.createdAt
                            .toDate()
                            .toLocaleString("en-NG");
                }

                return `
                    <div class="card">
                        <div class="notification-title">
                            ${escapeHTML(title)}
                        </div>

                        <div class="notification-text">
                            ${escapeHTML(text)}
                        </div>

                        ${
                            date
                                ? `<div class="notification-date">${escapeHTML(date)}</div>`
                                : ""
                        }

                        ${
                            notification.type === "RIDE_TRIP_AVAILABLE" &&
                            notification.tripId
                                ? `
                                    <div style="margin-top:14px;">
                                        <a
                                            href="ride.html?tripId=${encodeURIComponent(notification.tripId)}"
                                            style="display:inline-block;padding:10px 16px;background:#081b5a;color:#fff;text-decoration:none;border-radius:8px;font-weight:600;"
                                        >
                                            View Trip &amp; Book
                                        </a>
                                    </div>
                                  `
                                : ""
                        }

                        ${
                            notification.type === "RIDE_CONSOLIDATION_PROPOSED" &&
                            notification.requestId &&
                            !notification.read
                                ? `
                                    <div style="margin-top:14px;">
                                        <button
                                            type="button"
                                            onclick="respondToRideConsolidation('${encodeURIComponent(notification.requestId)}','ACCEPTED','${encodeURIComponent(notification.id)}')"
                                            style="padding:10px 16px;background:#081b5a;color:#fff;border:0;border-radius:8px;font-weight:600;cursor:pointer;margin-right:8px;"
                                        >
                                            Accept Proposal
                                        </button>

                                        <button
                                            type="button"
                                            onclick="respondToRideConsolidation('${encodeURIComponent(notification.requestId)}','DECLINED','${encodeURIComponent(notification.id)}')"
                                            style="padding:10px 16px;background:#fff;color:#081b5a;border:1px solid #081b5a;border-radius:8px;font-weight:600;cursor:pointer;"
                                        >
                                            Decline Proposal
                                        </button>
                                    </div>
                                  `
                                : ""
                        }
                    </div>
                `;

            }).join("");

    } catch (error) {

        console.error(
            "Notification loading error:",
            error
        );

        notificationsList.innerHTML = `
            <div class="empty">
                <h3>Unable to load notifications</h3>
                <p>Please try again later.</p>
            </div>
        `;
    }
});

async function respondToRideConsolidation(
    encodedRequestId,
    response,
    encodedNotificationId
) {

    const requestId =
        decodeURIComponent(encodedRequestId);

    const notificationId =
        decodeURIComponent(encodedNotificationId);

    if (
        response !== "ACCEPTED" &&
        response !== "DECLINED"
    ) {
        return;
    }

    const actionText =
        response === "ACCEPTED"
            ? "accept this consolidation proposal"
            : "decline this consolidation proposal";

    if (!window.confirm("Are you sure you want to " + actionText + "?")) {
        return;
    }

    try {

        const functions =
            firebase.functions();

        const respond =
            functions.httpsCallable(
                "respondToRideConsolidation"
            );

        await respond({
            requestId,
            response
        });

        await dreypellaDB
            .collection("notifications")
            .doc(notificationId)
            .update({
                read: true
            });

        alert(
            response === "ACCEPTED"
                ? "Consolidation proposal accepted."
                : "Consolidation proposal declined."
        );

        window.location.reload();

    } catch (error) {

        console.error(
            "Ride consolidation response error:",
            error
        );

        alert(
            error.message ||
            "Unable to respond to the consolidation proposal."
        );
    }
}

function escapeHTML(value) {

    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}
</script>

</body>
</html>
