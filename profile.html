<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Account Profile | Dreypella Ride</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fb;
            color: #081b5a;
        }

        .container {
            max-width: 600px;
            width: 100%;
            margin: auto;
            padding: 20px;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .back {
            text-decoration: none;
            color: #081b5a;
            font-size: 22px;
        }

        .card {
            background: #fff;
            border-radius: 18px;
            padding: 25px;
            box-shadow: 0 8px 25px rgba(8,27,90,.08);
        }

        .avatar {
            width: 80px;
            height: 80px;
            margin: 0 auto 18px;
            border-radius: 50%;
            background: #081b5a;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            font-weight: 700;
        }

        .row {
            padding: 15px 0;
            border-bottom: 1px solid #edf0f5;
        }

        .label {
            display: block;
            font-size: 12px;
            color: #7a8499;
            margin-bottom: 5px;
        }

        .value {
            font-weight: 600;
            color: #081b5a;
            word-break: break-word;
        }
    </style>
</head>

<body>

<div class="container">

    <header class="header">
        <a href="customer-dashboard.html" class="back">←</a>
        <h1>Account Profile</h1>
    </header>

    <section class="card">

        <div class="avatar" id="avatar">U</div>

        <div class="row">
            <span class="label">Name</span>
            <span class="value" id="name">Loading...</span>
        </div>

        <div class="row">
            <span class="label">Email</span>
            <span class="value" id="email">Loading...</span>
        </div>

        <div class="row">
            <span class="label">Phone</span>
            <span class="value" id="phone">Not provided</span>
        </div>

    </section>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="auth-guard.js"></script>

<script>
dreypellaAuth.onAuthStateChanged(async function(user) {

    if (!user) {
        return;
    }

    let profile = {};

    try {

        const doc =
            await dreypellaDB
                .collection("users")
                .doc(user.uid)
                .get();

        if (doc.exists) {
            profile = doc.data() || {};
        }

    } catch (error) {
        console.error(
            "Profile loading error:",
            error
        );
    }

    const name =
        profile.fullName ||
        profile.name ||
        user.displayName ||
        "User";

    const email =
        user.email ||
        profile.email ||
        "Not provided";

    const phone =
        profile.phone ||
        profile.phoneNumber ||
        user.phoneNumber ||
        "Not provided";

    document.getElementById("name").textContent = name;
    document.getElementById("email").textContent = email;
    document.getElementById("phone").textContent = phone;

    document.getElementById("avatar").textContent =
        name.charAt(0).toUpperCase();
});
</script>

</body>
</html>
