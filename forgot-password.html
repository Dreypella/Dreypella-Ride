<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | Dreypella Ride</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fb;
            color: #081b5a;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .forgot-container {
            width: 100%;
            max-width: 430px;
        }

        .card {
            background: #ffffff;
            border-radius: 18px;
            padding: 32px 26px;
            box-shadow: 0 12px 35px rgba(8, 27, 90, 0.12);
            border-top: 5px solid #e31b23;
        }

        .brand {
            text-align: center;
            font-size: 25px;
            font-weight: 800;
            color: #081b5a;
            margin-bottom: 22px;
        }

        .brand span {
            color: #e31b23;
        }

        h1 {
            text-align: center;
            font-size: 25px;
            margin-bottom: 10px;
            color: #081b5a;
        }

        .subtitle {
            text-align: center;
            color: #687086;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #081b5a;
        }

        input {
            width: 100%;
            padding: 14px 15px;
            border: 1px solid #d7dce8;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
            background: #ffffff;
            color: #222;
            margin-bottom: 17px;
        }

        input:focus {
            border-color: #081b5a;
            box-shadow: 0 0 0 3px rgba(8, 27, 90, 0.08);
        }

        button {
            width: 100%;
            border: none;
            border-radius: 10px;
            padding: 14px;
            background: #e31b23;
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.94;
        }

        button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        .message {
            display: none;
            margin-top: 18px;
            padding: 12px;
            border-radius: 9px;
            font-size: 14px;
            line-height: 1.5;
        }

        .message.success {
            display: block;
            background: #edf8f0;
            color: #176b32;
        }

        .message.error {
            display: block;
            background: #fff0f0;
            color: #b3131b;
        }

        .back-login {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #081b5a;
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;
        }

        .back-login:hover {
            color: #e31b23;
        }

        .footer {
            text-align: center;
            margin-top: 18px;
            font-size: 12px;
            color: #7b8293;
        }

        @media (max-width: 480px) {
            body {
                padding: 14px;
            }

            .card {
                padding: 27px 20px;
            }

            h1 {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

    <main class="forgot-container">

        <section class="card">

            <div class="brand">
                DREYPELLA <span>RIDE</span>
            </div>

            <h1>Forgot Password?</h1>

            <p class="subtitle">
                Enter the email address connected to your Dreypella Ride account.
                We'll send you a secure password reset link.
            </p>

            <form id="forgotPasswordForm">

                <label for="email">Email Address</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email address"
                    autocomplete="email"
                    required
                >

                <button type="submit" id="resetButton">
                    Send Reset Link
                </button>

            </form>

            <div id="message" class="message"></div>

            <a href="login.html" class="back-login">
                ← Back to Login
            </a>

        </section>

        <div class="footer">
            © 2026 Dreypella Ride. All rights reserved.
        </div>

    </main>

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
    <script src="firebase-config.js"></script>

    <script>
        const form = document.getElementById("forgotPasswordForm");
        const emailInput = document.getElementById("email");
        const resetButton = document.getElementById("resetButton");
        const message = document.getElementById("message");

        function showMessage(text, type) {
            message.textContent = text;
            message.className = "message " + type;
        }

        form.addEventListener("submit", async function(event) {
            event.preventDefault();

            const email = emailInput.value.trim();

            if (!email) {
                showMessage("Please enter your email address.", "error");
                return;
            }

            resetButton.disabled = true;
            resetButton.textContent = "Sending...";

            try {
                await dreypellaAuth.sendPasswordResetEmail(email);

                showMessage(
                    "Password reset instructions have been sent to your email. Please check your inbox and spam folder.",
                    "success"
                );

                form.reset();

            } catch (error) {
                console.error("Password reset error:", error);

                let errorMessage =
                    "Unable to send the password reset email. Please try again.";

                if (error.code === "auth/user-not-found") {
                    errorMessage =
                        "No Dreypella Ride account was found with this email address.";
                }

                if (error.code === "auth/invalid-email") {
                    errorMessage =
                        "Please enter a valid email address.";
                }

                if (error.code === "auth/too-many-requests") {
                    errorMessage =
                        "Too many attempts. Please wait a while and try again.";
                }

                showMessage(errorMessage, "error");

            } finally {
                resetButton.disabled = false;
                resetButton.textContent = "Send Reset Link";
            }
        });
    </script>

</body>
</html>
